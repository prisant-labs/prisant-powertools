# Project-level doc-update checklist extensions for prisant-utilities.
#
# Consumed by /plab-release-plan. The skill applies its eight built-in defaults first, then appends
# every row listed here. Rows are added, never substituted: if an entry names the same `doc` as a
# built-in, the built-in wins and this entry is ignored.
#
# Why these six exist. The built-in defaults were written for a repo with a single plugin manifest
# and a `docs/skills/README.md` index. This repo has two manifests that must agree (release hygiene
# gate (f) fails the tag when they do not), a generated manifest downstream of `library.json`, a
# per-skill status page, and per-skill usage docs with no index above them. Every row below
# corresponds to a file that has actually gone stale in a shipped release at least once.
#
# What this checklist does NOT cover, because the schema below is doc-to-update rows and these are
# not documents in THIS repository: running the eval suite locally before tagging (`evals/README.md`,
# not run in CI); repinning `.claude-plugin/marketplace.json`'s `ref` and `version` in the separate
# `prisant-labs/agent-plugins` repository through a PR there; and, after `claude plugin marketplace
# update prisant-labs` and `claude plugin update prisant-utilities@prisant-labs` and a restart,
# verifying the Claude Code install against a behaviour only the new version has.
#
# Codex reads the same `prisant-labs` marketplace and needs its own, separate upgrade step:
# `codex plugin marketplace upgrade prisant-labs`, followed by a check that `codex plugin list`
# reports `prisant-utilities@prisant-labs installed, enabled` at the new version. The v0.8.0 release
# missed this step: the Codex install stayed at 0.7.1 until the orchestrator ran the upgrade by hand
# on 2026-10-16. Post-release verification should name both "Claude Code install upgraded" and
# "Codex install upgraded" as separate checks, not only the one this repository happened to remember
# first.
#
# None of the above leaves a file in THIS repository for a checklist row to check off, which is why
# these steps are recorded here in prose rather than as `add:` rows, and why nothing here enforces
# that an operator actually ran them.
#
# Note on a built-in that does not apply: `docs/skills/README.md` does not exist in this repo; the
# per-skill READMEs sit directly under `docs/skills/<skill>/`. Check that built-in row off as
# "[x] N/A - no docs/skills/README.md in this repo" per the template's documented convention, and
# use the `docs/skills/<skill>/README.md` row below instead.

# What happens after the tag, added 2026-09-14. Pushing a `v*` tag now triggers
# `.github/workflows/publish-release.yml`, which extracts this version's CHANGELOG section and
# publishes it as a GitHub Release. Two consequences for whoever works this checklist:
#
#   1. The CHANGELOG entry must be committed and merged BEFORE the tag is pushed. The workflow
#      reads it from the tagged commit, and a tag with no matching section fails the run rather
#      than publishing an empty release.
#   2. Nothing else changes. The workflow chooses no version and writes no file; every row below
#      is still a human edit.
#
add:
  - doc: ".codex-plugin/plugin.json"
    update: >-
      Bump `version` to match `.claude-plugin/plugin.json`. Release hygiene gate (f) reads BOTH
      manifests and fails the tag when either disagrees with the release version.

  - doc: "library.json"
    update: >-
      Bump the top-level plugin `version` and the `version` of every component changed in this
      release. This is the source the generated manifest is built from, so a miss here propagates.

  - doc: "manifest.generated.json"
    update: >-
      Regenerate from library.json rather than hand-editing. It embeds skill descriptions verbatim,
      so a description edit that skips regeneration ships a manifest contradicting the skill.
      Run the toolkit generator with --write --target=all.

  - doc: "docs/skills/<skill>/README.md"
    update: >-
      Bump the version line in the usage doc of every affected skill. These drifted by as much as
      three minor versions before the 2026-08-23 parity sweep caught them.

  - doc: "docs/status-skills.md"
    update: >-
      Bump the "Plugin version" line, the At a glance table's Version column, and the per-skill
      "### plab-<skill> X.Y.Z" heading for every affected skill. scripts/version-parity-check.py
      checks the plugin-version line and the At a glance table against SKILL.md and library.json;
      it does not check the per-skill section headings, so a heading left behind after a version
      bump is caught only by reading this file, not by CI.

  - doc: "README.md skill table"
    update: >-
      Bump the Version column for every affected skill in the root README table (starts at line 9).
      Distinct from the built-in README row, which covers prose version references.
