# Gate
#
# This file makes no pass/fail decision of its own. It invokes committed gates
# and reports what they say (Standard sec 4.1 / 4.4). Validation logic lives in
# scripts and in the toolkit Action, never inline here.
#
# Two toolkit scripts are deliberately NOT invoked:
#
#   check-parity.mjs                 the toolkit's own validator-parity harness.
#                                    It is run by the toolkit's CI against the
#                                    toolkit, not by consumer repositories
#                                    (spec.md R2, S2).
#
#   verify-tag-matches-manifests.mjs requires a package.json this repository has
#                                    never had, and AGENTS.md names only
#                                    check.mjs as this repo's gate
#                                    (spec.md R2, R3, S3, S4).
#
# CI reports. It does not release, auto-fix, bump, or tag (spec.md AC-8).

name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standard-gate:
    name: Advanced Skill Library Standard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      - name: Grade against the Advanced Skill Library Standard
        id: gate
        uses: product-on-purpose/agent-skills-toolkit@v1.16.2   # pin a released tag, never a branch
        with:
          path: .
          fail-on-error: true
          annotations: true
          sarif: true

      - name: Upload SARIF to the Security tab
        if: always() && steps.gate.outputs.sarif-path != ''
        uses: github/codeql-action/upload-sarif@v4   # v3 targets Node 20, deprecated on runners, and the v3 line itself deprecates Dec 2026
        with:
          sarif_file: ${{ steps.gate.outputs.sarif-path }}

      - name: Report tier
        run: |
          echo "Earned tier: ${{ steps.gate.outputs.tier }}"
          echo "${{ steps.gate.outputs.errors }} error(s), ${{ steps.gate.outputs.warnings }} warning(s)"

  dash-check:
    name: "No em-dash / en-dash (repo-wide)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      - name: Run the dash check
        run: python3 scripts/check-dashes.py

  document-gates:
    name: "Document lifecycle (schema, cross-file, index freshness)"
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not a default worth trimming. The
      # cross-file gate's released-but-unfulfilled (invariant 4) and
      # released-but-prerelease-release-plan (invariant 10) checks each
      # compare a document's version field against `git tag -l`, and the
      # skill-drift gate below needs the single latest tag (`git describe
      # --tags --abbrev=0`) plus a diff since it. A default checkout fetches
      # NO tags, so any of these would have nothing to compare against and
      # would pass vacuously on every run while looking healthy. Both gates
      # now refuse to run at all against an empty tag list, so a shallow
      # checkout here fails loudly rather than silently certifying a tree it
      # never checked. Adversarial review found exactly this, with the
      # maintainer's own historical defect seeded and the gate still
      # reporting CLEAN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Each step runs even when an earlier one fails, so one pull request
      # surfaces every document problem at once instead of one per push. Any
      # failing step still fails the job. Exit 1 means findings to fix; exit 2
      # means the detector could not prove itself and its silence means nothing.
      - name: Frontmatter conforms to the committed JSON Schemas
        id: frontmatter
        run: python3 scripts/frontmatter-check.py

      - name: Cross-file lifecycle invariants
        id: lifecycle
        if: always()
        run: python3 scripts/doc-lifecycle-check.py

      - name: The generated cross-release index is current
        id: index
        if: always()
        run: python3 scripts/gen-release-index.py --check

      # The version numbers written in the documentation against the versions the
      # repository declares. This is NOT the hygiene sweep's Check 4, which asks a
      # different question (should this version have been bumped, judged against the
      # last tag); that recipe is mechanized separately, in CI, by the skill-drift
      # gate just below. v0.5.3 shipped with six stale references that every check
      # above passed over.
      - name: Documented versions match what the repository declares
        id: version-parity
        if: always()
        run: python3 scripts/version-parity-check.py

      # The hygiene-sweep Check 4 recipe (skills/plab-wrap-session/references/
      # hygiene-sweep.md), mechanized in CI: a skill whose folder changed since the
      # latest tag must have bumped its own version and recorded that version in its
      # own HISTORY.md. Mode matters: this repository deliberately lets effort pull
      # requests land with an unbumped skill and does all version bookkeeping in one
      # closing release PR, so a finding is ADVISORY (reported, exit 0) while
      # library.json's own version is unchanged since the tag, and ENFORCED (exit 1)
      # once it has moved, which is exactly the closing release PR's own moment.
      # Exit 2 means the checker could not prove itself. Never read it as clean.
      - name: Skills changed since the last tag bump their own version
        if: always()
        run: python3 scripts/skill-drift-check.py

      # plab-audit's own output gate, run against the committed sample bundle.
      #
      # WHY IT LIVES IN THIS JOB RATHER THAN ITS OWN. Branch protection on
      # `main` requires status checks BY JOB NAME, and it requires this job.
      # A new job would run, report, and be ignored by the merge gate until
      # someone remembered to add it in the repository settings, which is the
      # same "runs but does not gate" failure the step below exists to avoid.
      # For the same reason, DO NOT RENAME THIS JOB: the protection rule
      # matches the old name and renaming silently drops the requirement.
      #
      # WHY IT IS NAMED HERE AT ALL. This workflow enumerates its checks and
      # globs nothing, so a script that is not written out in a `run:` step
      # never executes in CI. `bundle-check.py` passing locally is not the
      # same as it running.
      #
      # The target is committed and deliberately NOT minimal: it is trimmed
      # from the Phase 2 fixture and keeps every required section, including
      # the `Decision records consulted` section R3 requires and the second
      # ranked roadmap item the per-item half of R6 needs. A sample cut to the
      # bare minimum would fail on the sample rather than on real output.
      # Mutation results proving each rule can fail against this sample are in
      # the effort's canary record.
      #
      # Exit 2 means the checker could not prove itself and its silence means
      # nothing. Never read it as clean.
      - name: The audit bundle checker, against its committed sample
        id: bundle-check
        if: always()
        run: python3 skills/plab-audit/scripts/bundle-check.py skills/plab-audit/examples/sample-bundle

      # The resolve-open-items walk checker, in both of its modes, against its
      # committed sample. Same job as the bundle checker, for the same reason:
      # branch protection requires status checks by job name, so a new job
      # would report without gating. The sample walk record is the first
      # design walk rewritten into the final format; the write-back pair is
      # one document before and after a walk decided one item. Mutation
      # results proving each rule can fail are in the effort's canary record.
      # Exit 2 means the checker could not prove itself. Never read it as clean.
      - name: The walk checker, against its committed sample walk record
        if: always()
        run: python3 skills/plab-resolve-open-items/scripts/walk-check.py record skills/plab-resolve-open-items/examples/sample-walk/walk-record.md

      - name: The walk checker, against its committed write-back pair
        if: always()
        run: python3 skills/plab-resolve-open-items/scripts/walk-check.py writeback skills/plab-resolve-open-items/examples/sample-walk/before.md skills/plab-resolve-open-items/examples/sample-walk/after.md

      # plab-ai-review's dispatch helper (A-02). This is the one script in this
      # job that talks to a subprocess at all, but that subprocess is a fake
      # codex-companion.mjs the test writes into a tempdir itself - never the
      # real Codex CLI, which is deliberately NOT a CI dependency (the spec's
      # portability requirement: the skill must work with no Codex CLI
      # installed at all). `node` is already on this runner for the Standard
      # gate job; setup-node is not needed here because actions/setup-python's
      # runner image ships one.
      - name: The dispatch helper, against a fake companion
        if: always()
        run: python3 skills/plab-ai-review/scripts/test-dispatch.py
